name: Controller checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test]'
      - run: ruff check app scripts tests
      - run: ruff format --check app scripts tests
      - run: python -m pytest -q
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: python -m pytest -q tests/test_integration.py --live-api
      - if: always()
        run: docker compose down
