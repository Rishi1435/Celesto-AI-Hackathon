[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "celesto-reconcile"
version = "0.1.0"
description = "A sandboxed reconciliation agent with an honest run ledger"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
  "celesto==0.1.8",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.3", "ruff>=0.14"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["submission: requires real Celesto-generated submission evidence", "integration: requires running Compose services"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
